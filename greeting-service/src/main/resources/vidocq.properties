# --- Application config, read by MicroProfile Config (Ravel) ---
# Overridable at runtime via the GREETING_MESSAGE environment variable.
greeting.message=Hello

# --- HTTP transport (Chappe) ---
# NOTE: in Vidocq 0.1.1 the listener always binds 8080; these keys are not yet
# wired to Chappe, so changing the port here has no effect (see README).
vidocq.http.host=0.0.0.0
vidocq.http.port=8080
